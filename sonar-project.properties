# Set organization/projectKey to match the SonarCloud project
# (Import from GitHub usually uses: <org>_<repo>).
sonar.organization=trustep
sonar.projectKey=trustep_io.trustep.bitbucket.pipes.aws-sam-custom-deploy
sonar.projectName=aws-sam-custom-deploy

sonar.sources=src/main/docker,.github/workflows
sonar.exclusions=**/LICENSE,**/.DS_Store,**/pipe.yml,**/vendor/**
sonar.coverage.exclusions=**/*
sonar.sourceEncoding=UTF-8

# python3 on the non-Python SAM images is Amazon Linux 2023's 3.9. Python variants run 3.12–3.14.
sonar.python.version=3.9, 3.10, 3.11, 3.12, 3.13, 3.14

# SonarCloud (SONAR_HOST_URL is not required in the workflow)
sonar.host.url=https://sonarcloud.io

# Bitbucket Pipe and AWS SAM build images require root at runtime; do not apply a non-root USER.
# curl stays instead of ADD: --proto "=https" blocks HTTP redirects, and the NVM script is
# checksum-verified before it runs. ADD cannot do either.
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=docker:S6471
sonar.issue.ignore.multicriteria.e1.resourceKey=**/Dockerfile
sonar.issue.ignore.multicriteria.e2.ruleKey=docker:S7026
sonar.issue.ignore.multicriteria.e2.resourceKey=**/Dockerfile
