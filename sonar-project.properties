# Ajustar organization/projectKey para coincidir con el proyecto en SonarCloud
# (Import from GitHub suele usar: <org>_<repo>).
sonar.organization=trustep
sonar.projectKey=trustep_io.trustep.bitbucket.pipes.aws-sam-custom-deploy
sonar.projectName=aws-sam-custom-deploy

sonar.sources=src/main/docker,.github/workflows
sonar.exclusions=**/LICENSE,**/.DS_Store,**/pipe.yml
sonar.coverage.exclusions=**/*
sonar.sourceEncoding=UTF-8

# SonarCloud (no hace falta SONAR_HOST_URL en el workflow)
sonar.host.url=https://sonarcloud.io

# Bitbucket Pipe + AWS SAM build images requieren root en runtime; no aplicar USER no-root.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=docker:S6471
sonar.issue.ignore.multicriteria.e1.resourceKey=**/Dockerfile
